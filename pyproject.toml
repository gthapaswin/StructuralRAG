[project]
name = "structuralrag"
version = "0.1.0"
description = "Structure-aware retrieval for long, hierarchical documents"
readme = "README.md"
authors = [
    { name = "G Thapaswin", email = "gthapaswin2006@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=2.19",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pydantic>=2",
    "pymupdf>=2.1",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "scipy>=1.18.1",
    "sentence-transformers>=6.3.0",
    "streamlit>=1.67.0",
    "torch>=2.15.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
finetune = [
    "accelerate>=1.1.0",
    "mlx-lm>=0.32.2",
]

# CPU-only PyTorch on Linux (CI and Docker): avoids multi-GB CUDA wheels. macOS uses PyPI (MPS).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
